[package]
name = "wowforever-wasm"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wowforever-data = { path = "../data" }
wowforever-engine = { path = "../engine" }
wowforever-burst = { path = "../burst" }
wowforever-heal = { path = "../heal" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.100"
# Pulled in transitively via rand/rand_pcg. Our engine always seeds its RNG
# explicitly (Pcg32::seed_from_u64) and never touches OS entropy at runtime,
# but the dependency graph still needs to compile for wasm32-unknown-unknown,
# which getrandom refuses to do without an explicit backend choice.
getrandom = { version = "0.2", features = ["js"] }
