[workspace]
resolver = "2"
members = ["crates/data", "crates/stats", "crates/engine", "crates/storage", "crates/burst", "crates/ingest", "crates/recommend", "crates/wasm", "crates/raid", "crates/heal", "crates/gear", "crates/cli"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_pcg = "0.3"
regex = "1"
ureq = "3"
